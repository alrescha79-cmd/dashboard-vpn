services:
  vpn-dashboard:
    build: .
    container_name: vpn-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.example
    environment:
      - PORT=3000
      - DB_PATH=/app/data/vpn.db
      - NODE_ENV=production
